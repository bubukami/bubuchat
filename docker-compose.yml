version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bubuchat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bubuchat
      MYSQL_USER: bubuchat
      MYSQL_PASSWORD: bubuchat_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bubuchat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bubuchat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bubuchat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bubuchat-server
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bubuchat
      DB_USER: bubuchat
      DB_PASSWORD: bubuchat_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_key_change_this
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bubuchat-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bubuchat-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - bubuchat-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  bubuchat-network:
    driver: bridge
